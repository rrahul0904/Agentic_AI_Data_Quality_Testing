name: ade-local

services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      PORT: "8001"
      ADE_RUNTIME_MODE: production
      ADE_DEMO_MODE: "false"
      ADE_SAFE_MODE: "true"
      ADE_ONLINE_ENABLED: "false"
      ADE_CONNECTOR_WRITE_ENABLED: "false"
      ADE_AUTH_MODE: api_key
      ADE_API_KEYS_JSON: ${ADE_API_KEYS_JSON:?ADE_API_KEYS_JSON is required}
      ADE_PROJECT_SOURCE_MODE: filesystem
      ADE_PROJECT_ROOT: /app/hospitality-snowflake-data-platform
      ADE_WORKSPACE_ROOT: /workspaces
      ADE_ARTIFACT_STORE_MODE: filesystem
      ADE_ARTIFACT_ROOT: /state/artifacts
      ADE_DATABASE_PATH: /state/control-plane.db
      ADE_QUALITY_DATABASE: /state/quality.db
      ADE_INVESTIGATION_DATABASE: /state/investigations.db
      ADE_COMMIT_SHA: ${ADE_COMMIT_SHA:-local}
      ADE_UI_ORIGINS: http://localhost:${ADE_WEB_PORT:-3000},http://127.0.0.1:${ADE_WEB_PORT:-3000}
    volumes:
      - ade-local-state:/state
      - ade-local-workspaces:/workspaces
    ports:
      - "${ADE_API_BIND:-127.0.0.1}:${ADE_API_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      ADE_API_URL: http://api:8001
      ADE_API_SERVICE_TOKEN: ${ADE_API_SERVICE_TOKEN:?ADE_API_SERVICE_TOKEN is required}
      ADE_WEB_USERS_JSON: ${ADE_WEB_USERS_JSON:-{}}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADE_WEB_BIND:-127.0.0.1}:${ADE_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/api/healthz
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

volumes:
  ade-local-state:
  ade-local-workspaces:
