services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      PORT: "8001"
      ADE_RUNTIME_MODE: production
      ADE_DEMO_MODE: "false"
      ADE_AUTH_MODE: api_key
      ADE_API_KEYS_JSON: ${ADE_API_KEYS_JSON:?ADE_API_KEYS_JSON is required}
      # Mount-free by default. Set mode=git plus an HTTPS URL/ref for a managed
      # checkout, or override ADE_PROJECT_ROOT in an operator-specific deployment.
      ADE_PROJECT_SOURCE_MODE: ${ADE_PROJECT_SOURCE_MODE:-embedded_demo}
      ADE_PROJECT_ROOT: ${ADE_PROJECT_ROOT:-/app/hospitality-snowflake-data-platform}
      ADE_PROJECT_GIT_URL: ${ADE_PROJECT_GIT_URL:-}
      ADE_PROJECT_GIT_REF: ${ADE_PROJECT_GIT_REF:-}
      ADE_PROJECT_GIT_ALLOWED_HOSTS: ${ADE_PROJECT_GIT_ALLOWED_HOSTS:-github.com,gitlab.com,bitbucket.org}
      ADE_WORKSPACE_ROOT: /workspaces
      # Optional hosted PostgreSQL backends. Empty values preserve the
      # single-node SQLite volume fallback below.
      ADE_DATABASE_URL: ${ADE_DATABASE_URL:-}
      ADE_INVESTIGATION_DATABASE_URL: ${ADE_INVESTIGATION_DATABASE_URL:-}
      ADE_QUALITY_DATABASE_URL: ${ADE_QUALITY_DATABASE_URL:-}
      ADE_DATABASE_PATH: /state/control-plane.db
      ADE_QUALITY_DATABASE: /state/quality.db
      ADE_INVESTIGATION_DATABASE: /state/investigations.db
      ADE_COMMIT_SHA: ${ADE_COMMIT_SHA:?ADE_COMMIT_SHA is required}
      ADE_EXTERNAL_ASSURANCE_EVIDENCE: ${ADE_EXTERNAL_ASSURANCE_EVIDENCE:-}
    volumes:
      - ade-production-state:/state
      - ade-production-workspaces:/workspaces
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      ADE_API_URL: http://api:8001
      ADE_WEB_AUTH_MODE: basic
      ADE_WEB_USERS_JSON: ${ADE_WEB_USERS_JSON:?ADE_WEB_USERS_JSON is required}
      ADE_API_SERVICE_TOKEN: ${ADE_API_SERVICE_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADE_WEB_BIND:-127.0.0.1}:${ADE_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/api/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  ade-production-state:
  ade-production-workspaces:
