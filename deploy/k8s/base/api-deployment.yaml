apiVersion: apps/v1
kind: Deployment
metadata:
  name: ade-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ade-api
  template:
    metadata:
      labels:
        app: ade-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/rrahul0904/agentic-ai-data-quality-testing-api:sha-REPLACE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: ade-config
            - secretRef:
                name: ade-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: project
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ade-state
        - name: project
          persistentVolumeClaim:
            claimName: ade-project
