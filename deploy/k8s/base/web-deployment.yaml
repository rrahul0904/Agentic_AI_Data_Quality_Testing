apiVersion: apps/v1
kind: Deployment
metadata:
  name: ade-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ade-web
  template:
    metadata:
      labels:
        app: ade-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/rrahul0904/agentic-ai-data-quality-testing-web:sha-REPLACE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: ADE_API_URL
              value: http://ade-api:8001
            - name: ADE_WEB_AUTH_MODE
              value: basic
          envFrom:
            - secretRef:
                name: ade-web-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
