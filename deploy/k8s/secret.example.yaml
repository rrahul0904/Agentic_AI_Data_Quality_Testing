apiVersion: v1
kind: Secret
metadata:
  name: ade-api-secrets
  namespace: ade
type: Opaque
stringData:
  ADE_API_KEYS_JSON: '<replace-with-api-key-json>'
  # Optional hosted persistence. Omit these three keys to keep the SQLite/PVC
  # fallback from the ConfigMap. Keep real DSNs in a secret manager; do not
  # commit credentials to source control.
  ADE_DATABASE_URL: '<optional-postgresql-control-plane-dsn>'
  ADE_INVESTIGATION_DATABASE_URL: '<optional-postgresql-investigation-dsn>'
  ADE_QUALITY_DATABASE_URL: '<optional-postgresql-quality-dsn>'
---
apiVersion: v1
kind: Secret
metadata:
  name: ade-web-secrets
  namespace: ade
type: Opaque
stringData:
  ADE_WEB_USERS_JSON: '<replace-with-web-user-json>'
