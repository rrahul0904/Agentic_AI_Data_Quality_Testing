[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-engineering-platform"
version = "0.3.0"
description = "Policy-governed agentic control plane for data engineering, migration, testing, and verification."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.28,<1", "sqlglot>=30.17,<31", "PyYAML>=6", "textual>=1,<8", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4", "python-multipart>=0.0.9", "agent-client-protocol>=0.12.1,<0.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx2>=2.12,<3", "duckdb>=1.2", "dbt-snowflake>=1.9,<2"]
warehouses = ["duckdb>=1.2", "snowflake-connector-python>=3", "psycopg[binary]>=3", "oracledb>=2", "google-cloud-bigquery>=3", "databricks-sql-connector>=3", "pymongo>=4", "PyMySQL>=1.1", "clickhouse-connect>=0.8", "trino>=0.330", "pyodbc>=5"]
testbed = ["pyarrow>=16,<23", "boto3>=1.34", "snowflake-connector-python>=3"]

[project.scripts]
ade = "agentic_data_platform.cli_entry:main"
agentic = "agentic_data_platform.entrypoint:main"
agentic-data-platform = "agentic_data_platform.cli_entry:main"
ade-acp = "agentic_data_platform.acp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]