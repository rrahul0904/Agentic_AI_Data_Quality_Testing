name: live-review-e2e

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-review:
    runs-on: ubuntu-latest
    env:
      ADE_REVIEW_PROVIDER: github
      ADE_REVIEW_GITHUB_TOKEN: ${{ secrets.ADE_REVIEW_GITHUB_TOKEN }}
      ADE_REVIEW_GITHUB_REPOSITORY: ${{ vars.ADE_REVIEW_GITHUB_REPOSITORY }}
      ADE_REVIEW_GITHUB_PR_NUMBER: ${{ vars.ADE_REVIEW_GITHUB_PR_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/parse_dbt.py
      - run: PYTHONPATH=src python scripts/live_review_e2e.py

  gitlab-review:
    runs-on: ubuntu-latest
    env:
      ADE_REVIEW_PROVIDER: gitlab
      ADE_REVIEW_GITLAB_TOKEN: ${{ secrets.ADE_REVIEW_GITLAB_TOKEN }}
      ADE_REVIEW_GITLAB_PROJECT: ${{ vars.ADE_REVIEW_GITLAB_PROJECT }}
      ADE_REVIEW_GITLAB_MR_IID: ${{ vars.ADE_REVIEW_GITLAB_MR_IID }}
      ADE_REVIEW_GITLAB_API_URL: ${{ vars.ADE_REVIEW_GITLAB_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/parse_dbt.py
      - run: PYTHONPATH=src python scripts/live_review_e2e.py
