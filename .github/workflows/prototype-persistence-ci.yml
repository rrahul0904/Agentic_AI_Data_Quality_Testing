name: prototype-persistence-ci

on:
  push:
    branches:
      - feature/prototype-1-cloud-experience
    paths:
      - "src/agentic_data_platform/persistence/**"
      - "tests/test_cloud_persistence.py"
      - "pyproject.toml"
      - ".github/workflows/prototype-persistence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence-contract:
    name: Cloud persistence contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest "psycopg[binary]>=3"

      - name: Compile persistence modules
        env:
          PYTHONPATH: src
        run: python -m compileall -q src/agentic_data_platform/persistence

      - name: Run cloud persistence contract tests
        env:
          PYTHONPATH: src
        run: pytest -q tests/test_cloud_persistence.py
