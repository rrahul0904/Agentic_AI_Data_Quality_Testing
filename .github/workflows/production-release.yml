name: production-release

on:
  workflow_dispatch:
    inputs:
      run_live_snowflake:
        description: "Require live read-only Snowflake certification before publishing images"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-ai-data-quality-testing-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-ai-data-quality-testing-web

jobs:
  certify:
    name: Exact-SHA repository certification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install projects
        run: |
          python -m pip install -e '.[dev,testbed]'
          python -m pip install -e './shiftforge[dev]'
          python -m pip install -e './hospitality-snowflake-data-platform[dev]'
          npm ci --prefix apps/web

      - name: Parse dbt artifacts
        run: python scripts/parse_dbt.py

      - name: Canonical verification
        run: make verify

      - name: Production security contract
        run: pytest -q tests/test_api_production_security.py tests/test_production_deployment_manifests.py

      - name: Build web application
        run: npm run build --prefix apps/web

  live-snowflake:
    name: Optional live Snowflake certification
    if: ${{ inputs.run_live_snowflake }}
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: snowflake-pipeline-test
    env:
      ADE_SNOWFLAKE_ACCOUNT: ${{ secrets.ADE_SNOWFLAKE_ACCOUNT }}
      ADE_SNOWFLAKE_USER: ${{ secrets.ADE_SNOWFLAKE_USER }}
      ADE_SNOWFLAKE_PASSWORD: ${{ secrets.ADE_SNOWFLAKE_PASSWORD }}
      ADE_SNOWFLAKE_DATABASE: ${{ secrets.ADE_SNOWFLAKE_DATABASE }}
      ADE_SNOWFLAKE_SCHEMA: ${{ secrets.ADE_SNOWFLAKE_SCHEMA }}
      ADE_SNOWFLAKE_WAREHOUSE: ${{ secrets.ADE_SNOWFLAKE_WAREHOUSE }}
      ADE_SNOWFLAKE_ROLE: ${{ secrets.ADE_SNOWFLAKE_ROLE }}
      ADE_LIVE_SNOWFLAKE_STAGE: ${{ secrets.ADE_LIVE_SNOWFLAKE_STAGE }}
      ADE_LIVE_SNOWFLAKE_FILE_FORMAT: ${{ secrets.ADE_LIVE_SNOWFLAKE_FILE_FORMAT }}
      ADE_LIVE_SNOWFLAKE_PIPE: ${{ secrets.ADE_LIVE_SNOWFLAKE_PIPE }}
      ADE_LIVE_SNOWFLAKE_STREAM: ${{ secrets.ADE_LIVE_SNOWFLAKE_STREAM }}
      ADE_LIVE_SNOWFLAKE_TARGET_TABLE: ${{ secrets.ADE_LIVE_SNOWFLAKE_TARGET_TABLE }}
      ADE_LIVE_SNOWFLAKE_KEY_COLUMNS: ${{ vars.ADE_LIVE_SNOWFLAKE_KEY_COLUMNS }}
      ADE_LIVE_SNOWFLAKE_NOT_NULL_COLUMNS: ${{ vars.ADE_LIVE_SNOWFLAKE_NOT_NULL_COLUMNS }}
      ADE_LIVE_SNOWFLAKE_FRESHNESS_COLUMN: ${{ vars.ADE_LIVE_SNOWFLAKE_FRESHNESS_COLUMN }}
      ADE_LIVE_SNOWFLAKE_MAX_LATENCY_MINUTES: ${{ vars.ADE_LIVE_SNOWFLAKE_MAX_LATENCY_MINUTES }}
      ADE_LIVE_SNOWFLAKE_MAX_REJECTED_ROWS: ${{ vars.ADE_LIVE_SNOWFLAKE_MAX_REJECTED_ROWS }}
      ADE_LIVE_SNOWFLAKE_HISTORY_HOURS: ${{ vars.ADE_LIVE_SNOWFLAKE_HISTORY_HOURS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live Snowflake dependencies
        run: python -m pip install -e '.[dev,warehouses]'
      - name: Run live read-only Snowflake certification
        run: make snowflake-pipeline-live-e2e

  publish:
    name: Publish immutable production images
    needs: [certify, live-snowflake]
    if: >-
      ${{
        always()
        && needs.certify.result == 'success'
        && (!inputs.run_live_snowflake || needs.live-snowflake.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ env.API_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Attest API provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.API_IMAGE }}
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true

      - name: Build and publish web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Attest web provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.WEB_IMAGE }}
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true

      - name: Generate immutable release manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          LIVE_SNOWFLAKE_REQUESTED: ${{ inputs.run_live_snowflake }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os
          from pathlib import Path

          owner = os.environ["GITHUB_REPOSITORY_OWNER"]
          sha = os.environ["GITHUB_SHA"]
          api_name = f"ghcr.io/{owner}/agentic-ai-data-quality-testing-api"
          web_name = f"ghcr.io/{owner}/agentic-ai-data-quality-testing-web"
          payload = {
              "schema_version": "ade-production-release/1.0",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": sha,
              "ref": os.environ["GITHUB_REF"],
              "live_snowflake_certification_requested": os.environ["LIVE_SNOWFLAKE_REQUESTED"].lower() == "true",
              "images": {
                  "api": {
                      "tag": f"{api_name}:sha-{sha}",
                      "digest": os.environ["API_DIGEST"],
                      "immutable": f"{api_name}@{os.environ['API_DIGEST']}",
                  },
                  "web": {
                      "tag": f"{web_name}:sha-{sha}",
                      "digest": os.environ["WEB_DIGEST"],
                      "immutable": f"{web_name}@{os.environ['WEB_DIGEST']}",
                  },
              },
              "deployment_contracts": [
                  "docker-compose.release.yml",
                  "deploy/k8s/base",
                  "docs/PRODUCTION_DEPLOYMENT.md",
              ],
          }
          Path("artifacts/production-release.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: artifacts/production-release.json
          if-no-files-found: error
