name: ade-capability-superiority

on:
  pull_request:
    paths:
      - 'src/agentic_data_platform/snowflake/**'
      - 'src/agentic_data_platform/connectors/snowflake.py'
      - 'src/agentic_data_platform/tools/**'
      - 'src/agentic_data_platform/cli.py'
      - 'src/agentic_data_platform/api/app.py'
      - 'specs/ADE_REFERENCE_CAPABILITY_SUPERIORITY_LEDGER.json'
      - 'scripts/check_capability_superiority.py'
      - 'tests/test_capability_superiority_ledger.py'
      - 'tests/test_snowflake_governed_mutation.py'
      - '.github/workflows/ade-capability-superiority.yml'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ade-capability-superiority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate exhaustive capability ledger
        run: make capability-superiority-check
      - name: Governed Snowflake mutation tests
        run: make snowflake-governed-mutation-test
      - name: Offline CREATE plan smoke
        run: |
          ade snowflake-admin plan --environment dev --args '{"sql":"CREATE TABLE HOTEL.RAW.CI_MUTATION_TEST(ID NUMBER)"}'
      - name: Offline approved dry-run smoke
        shell: bash
        run: |
          FINGERPRINT="$(python - <<'PY'
          from agentic_data_platform.snowflake import plan_snowflake_mutation
          print(plan_snowflake_mutation(
              "CREATE TABLE HOTEL.RAW.CI_MUTATION_TEST(ID NUMBER)",
              environment="dev",
          )["approval_fingerprint"])
          PY
          )"
          ade snowflake-admin execute \
            --environment dev \
            --builder \
            --approved \
            --dry-run \
            --args "{\"sql\":\"CREATE TABLE HOTEL.RAW.CI_MUTATION_TEST(ID NUMBER)\",\"approval_fingerprint\":\"$FINGERPRINT\"}"
      - name: Production destructive policy smoke
        run: |
          python - <<'PY'
          from agentic_data_platform.snowflake import plan_snowflake_mutation
          result = plan_snowflake_mutation(
              "DROP TABLE HOTEL.RAW.CI_MUTATION_TEST",
              environment="prod",
          )
          assert result["status"] == "BLOCKED_POLICY", result
          print(result["status"])
          PY
      - name: Ruff targeted files
        run: ruff check src/agentic_data_platform/snowflake src/agentic_data_platform/connectors/snowflake.py tests/test_snowflake_governed_mutation.py tests/test_capability_superiority_ledger.py scripts/check_capability_superiority.py

  full-regression:
    needs: targeted-certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python projects
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e './shiftforge[dev]'
          python -m pip install -e './hospitality-snowflake-data-platform[dev]'
      - name: Install operator console
        run: npm ci
        working-directory: apps/web
      - name: Parse dbt artifacts
        run: python scripts/parse_dbt.py
      - name: Full repository verification
        run: make verify
