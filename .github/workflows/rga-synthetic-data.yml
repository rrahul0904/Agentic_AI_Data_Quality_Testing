name: rga-synthetic-data

on:
  pull_request:
    branches:
      - feature/snowflake-pipeline-testing
    paths:
      - "config/rga_domain.yml"
      - "scripts/rga_testbed/**"
      - "tests/rga_testbed/**"
      - "docs/RGA_SYNTHETIC_DATA_PACK.md"
      - ".github/workflows/rga-synthetic-data.yml"
  push:
    branches:
      - feature/rga-synthetic-domain-pack
    paths:
      - "config/rga_domain.yml"
      - "scripts/rga_testbed/**"
      - "tests/rga_testbed/**"
      - "docs/RGA_SYNTHETIC_DATA_PACK.md"
      - ".github/workflows/rga-synthetic-data.yml"

permissions:
  contents: read

concurrency:
  group: rga-synthetic-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile RGA Python surface
        run: python -m compileall -q scripts/rga_testbed tests/rga_testbed
      - name: Run RGA tests
        run: python -m pytest -q -p no:cacheprovider tests/rga_testbed
      - name: Generate bounded smoke dataset
        run: python scripts/rga_testbed/generate_data.py --preset tiny --policies 120 --seed 42 --output /tmp/rga-smoke
      - name: Validate generated dataset
        run: python scripts/rga_testbed/validate_dataset.py --input /tmp/rga-smoke
      - name: Compile Snowflake DDL and load SQL
        run: |
          python scripts/rga_testbed/generate_snowflake_ddl.py --output /tmp/rga-smoke/001_raw_tables.sql
          python scripts/rga_testbed/generate_load_sql.py --output /tmp/rga-smoke/002_load_raw.sql --local-root /tmp/rga-smoke/csv
      - name: Generate dbt analytics project
        run: python scripts/rga_testbed/generate_dbt_project.py --output /tmp/rga-dbt
      - name: Generate Snowflake semantic view contract
        run: python scripts/rga_testbed/generate_semantic_view.py --output /tmp/rga-semantic
      - name: Generate paired performance benchmark pack
        run: python scripts/rga_testbed/generate_benchmark_pack.py --output /tmp/rga-benchmarks
      - name: Generate Airflow orchestration
        run: |
          python scripts/rga_testbed/generate_airflow_dag.py --output /tmp/rga-airflow/rga_synthetic_pipeline.py
          python -m py_compile /tmp/rga-airflow/rga_synthetic_pipeline.py
      - name: Certify Snowflake executor fail-closed behavior
        run: |
          set +e
          python scripts/rga_testbed/execute_snowflake_sql.py --sql-file /tmp/rga-smoke/001_raw_tables.sql >/tmp/executor-refusal.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Refusing Snowflake execution without --confirm' /tmp/executor-refusal.json
          python scripts/rga_testbed/execute_snowflake_sql.py --sql-file /tmp/rga-smoke/001_raw_tables.sql --confirm --dry-run >/tmp/executor-dry-run.json
          grep -q 'DRY_RUN' /tmp/executor-dry-run.json
      - name: Verify critical contracts
        run: |
          grep -q 'CREATE SCHEMA IF NOT EXISTS SEMANTIC' /tmp/rga-smoke/001_raw_tables.sql
          grep -q 'COPY INTO RAW.POLICIES' /tmp/rga-smoke/002_load_raw.sql
          grep -q 'COPY INTO RAW.CLAIMS' /tmp/rga-smoke/002_load_raw.sql
          grep -q "source('rga_raw', 'policies')" /tmp/rga-dbt/models/staging/stg_policies.sql
          grep -q "alias='REINSURANCE_PERFORMANCE'" /tmp/rga-dbt/models/marts/mart_reinsurance_performance.sql
          grep -q 'CEDED_LOSS_RATIO' /tmp/rga-semantic/rga_reinsurance_performance.yml
          grep -q 'SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML' /tmp/rga-semantic/verify_semantic_view.sql
          grep -q 'SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML' /tmp/rga-semantic/deploy_semantic_view.sql
          grep -q 'recommended_concurrency' /tmp/rga-benchmarks/manifest.json
          grep -q 'semantic_view(' /tmp/rga-benchmarks/monthly_loss_ratio_by_cedant.semantic.sql
          grep -q 'semantic_deploy_gate' /tmp/rga-airflow/rga_synthetic_pipeline.py
