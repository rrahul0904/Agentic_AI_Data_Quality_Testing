name: rga-synthetic-data

on:
  pull_request:
    branches:
      - feature/snowflake-pipeline-testing
    paths:
      - "config/rga_domain.yml"
      - "config/rga_semantic_contract.yml"
      - "scripts/rga_testbed/**"
      - "tests/rga_testbed/**"
      - "docs/RGA_SYNTHETIC_DATA_PACK.md"
      - "docs/GOVERNED_SEMANTIC_PLATFORM_REQUIREMENTS.md"
      - "docs/SEMANTIC_PLATFORM_EXTERNAL_RESEARCH.md"
      - ".github/workflows/rga-synthetic-data.yml"
  push:
    branches:
      - feature/rga-synthetic-domain-pack
    paths:
      - "config/rga_domain.yml"
      - "config/rga_semantic_contract.yml"
      - "scripts/rga_testbed/**"
      - "tests/rga_testbed/**"
      - "docs/RGA_SYNTHETIC_DATA_PACK.md"
      - "docs/GOVERNED_SEMANTIC_PLATFORM_REQUIREMENTS.md"
      - "docs/SEMANTIC_PLATFORM_EXTERNAL_RESEARCH.md"
      - ".github/workflows/rga-synthetic-data.yml"

permissions:
  contents: read

concurrency:
  group: rga-synthetic-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile RGA Python surface
        run: python -m compileall -q scripts/rga_testbed tests/rga_testbed
      - name: Run RGA tests
        run: python -m pytest -q -p no:cacheprovider tests/rga_testbed
      - name: Generate bounded smoke dataset
        run: python scripts/rga_testbed/generate_data.py --preset tiny --policies 120 --seed 42 --output /tmp/rga-smoke
      - name: Validate generated dataset
        run: python scripts/rga_testbed/validate_dataset.py --input /tmp/rga-smoke
      - name: Generate CDC and late-arriving fixtures
        run: |
          python scripts/rga_testbed/generate_change_events.py --input /tmp/rga-smoke --output /tmp/rga-cdc --events-per-type 5
          grep -q '"status": "PASS"' /tmp/rga-cdc/manifest.json
          grep -q '"event_count": 15' /tmp/rga-cdc/manifest.json
          grep -q 'late_arriving_claim' /tmp/rga-cdc/change_events.jsonl
          grep -q 'premium_correction' /tmp/rga-cdc/change_events.jsonl
          grep -q 'policy_status_change' /tmp/rga-cdc/change_events.jsonl
      - name: Compile Snowflake DDL and load SQL
        run: |
          python scripts/rga_testbed/generate_snowflake_ddl.py --output /tmp/rga-smoke/001_raw_tables.sql
          python scripts/rga_testbed/generate_load_sql.py --output /tmp/rga-smoke/002_load_raw.sql --local-root /tmp/rga-smoke/csv
      - name: Generate dbt analytics project
        run: python scripts/rga_testbed/generate_dbt_project.py --output /tmp/rga-dbt
      - name: Generate Snowflake semantic view contract
        run: python scripts/rga_testbed/generate_semantic_view.py --output /tmp/rga-semantic
      - name: Compile canonical semantic manifest
        run: python scripts/rga_testbed/compile_semantic_manifest.py --output /tmp/rga-manifest/semantic_manifest.json
      - name: Export Apache Ossie interchange model
        run: python scripts/rga_testbed/export_ossie.py --output /tmp/rga-interchange/rga_reinsurance_performance.ossie.yml
      - name: Generate governed AI contracts
        run: python scripts/rga_testbed/generate_ai_integration.py --output /tmp/rga-ai
      - name: Generate Microsoft consumer contracts
        run: python scripts/rga_testbed/generate_microsoft_consumer_pack.py --output /tmp/rga-microsoft
      - name: Generate paired performance benchmark pack
        run: python scripts/rga_testbed/generate_benchmark_pack.py --output /tmp/rga-benchmarks
      - name: Generate Snowflake acceleration plan
        run: python scripts/rga_testbed/generate_acceleration_plan.py --output /tmp/rga-acceleration
      - name: Generate cross-consumer semantic parity suite
        run: python scripts/rga_testbed/generate_parity_suite.py --output /tmp/rga-parity
      - name: Build governed semantic release bundle
        run: python scripts/rga_testbed/build_semantic_release.py --output /tmp/rga-release --source-sha "$GITHUB_SHA"
      - name: Certify benchmark runner dry-run
        run: |
          set +e
          python scripts/rga_testbed/run_snowflake_benchmark.py --manifest /tmp/rga-benchmarks/manifest.json --mode both --concurrency 10 --iterations 2 >/tmp/benchmark-refusal.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Refusing live Snowflake benchmark without --confirm-live' /tmp/benchmark-refusal.json
          python scripts/rga_testbed/run_snowflake_benchmark.py --manifest /tmp/rga-benchmarks/manifest.json --mode both --concurrency 10 --iterations 2 --dry-run >/tmp/benchmark-dry-run.json
          grep -q 'DRY_RUN' /tmp/benchmark-dry-run.json
          grep -q '"task_count": 12' /tmp/benchmark-dry-run.json
      - name: Generate Airflow orchestration
        run: |
          python scripts/rga_testbed/generate_airflow_dag.py --output /tmp/rga-airflow/rga_synthetic_pipeline.py
          python -m py_compile /tmp/rga-airflow/rga_synthetic_pipeline.py
      - name: Certify Snowflake executor fail-closed behavior
        run: |
          set +e
          python scripts/rga_testbed/execute_snowflake_sql.py --sql-file /tmp/rga-smoke/001_raw_tables.sql >/tmp/executor-refusal.json
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'Refusing Snowflake execution without --confirm' /tmp/executor-refusal.json
          python scripts/rga_testbed/execute_snowflake_sql.py --sql-file /tmp/rga-smoke/001_raw_tables.sql --confirm --dry-run >/tmp/executor-dry-run.json
          grep -q 'DRY_RUN' /tmp/executor-dry-run.json
      - name: Verify critical contracts
        run: |
          grep -q 'CREATE SCHEMA IF NOT EXISTS SEMANTIC' /tmp/rga-smoke/001_raw_tables.sql
          grep -q 'CREATE SCHEMA IF NOT EXISTS AI' /tmp/rga-smoke/001_raw_tables.sql
          grep -q 'COPY INTO RAW.POLICIES' /tmp/rga-smoke/002_load_raw.sql
          grep -q 'COPY INTO RAW.CLAIMS' /tmp/rga-smoke/002_load_raw.sql
          grep -q "source('rga_raw', 'policies')" /tmp/rga-dbt/models/staging/stg_policies.sql
          grep -q "alias='REINSURANCE_PERFORMANCE'" /tmp/rga-dbt/models/marts/mart_reinsurance_performance.sql
          grep -q 'CEDED_LOSS_RATIO' /tmp/rga-semantic/rga_reinsurance_performance.yml
          grep -q 'SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML' /tmp/rga-semantic/verify_semantic_view.sql
          grep -q 'SYSTEM$CREATE_SEMANTIC_VIEW_FROM_YAML' /tmp/rga-semantic/deploy_semantic_view.sql
          grep -q 'cortex_analyst_text_to_sql' /tmp/rga-ai/create_agent.sql
          grep -q 'RGA_SYNTHETIC_TESTBED.SEMANTIC.RGA_REINSURANCE_PERFORMANCE' /tmp/rga-ai/create_agent.sql
          grep -q 'CORTEX_AGENT_RUN' /tmp/rga-ai/create_mcp_server.sql
          ! grep -q 'SYSTEM_EXECUTE_SQL' /tmp/rga-ai/mcp_spec.yml
          grep -q 'private_preview_feature_gate' /tmp/rga-microsoft/consumer_contract.json
          grep -q 'required_connection_mode' /tmp/rga-microsoft/consumer_contract.json
          grep -q '<XMLA_ENDPOINT_NAME>' /tmp/rga-microsoft/xmla_setup.template.sql
          grep -q 'Direct-connection fallback is connectivity evidence, not semantic-parity certification' /tmp/rga-microsoft/PARITY_CHECKLIST.md
          grep -q 'recommended_concurrency' /tmp/rga-benchmarks/manifest.json
          grep -q 'semantic_view(' /tmp/rga-benchmarks/monthly_loss_ratio_by_cedant.semantic.sql
          grep -q 'ADD MATERIALIZATION' /tmp/rga-acceleration/semantic_materializations.template.sql
          grep -q '<MATERIALIZATION_WAREHOUSE>' /tmp/rga-acceleration/semantic_materializations.template.sql
          grep -q 'underlying_mart_optimization' /tmp/rga-acceleration/acceleration_plan.json
          grep -q 'SYSTEM$MANAGE_SEMANTIC_VIEW_MATERIALIZATIONS_FROM_YAML' /tmp/rga-acceleration/sync_semantic_materializations.template.sql
          grep -q 'materializations:' /tmp/rga-acceleration/semantic_materializations.yml
          grep -q 'manifest_sha256' /tmp/rga-manifest/semantic_manifest.json
          grep -q 'ceded_loss_ratio' /tmp/rga-interchange/rga_reinsurance_performance.ossie.yml
          grep -q 'semantic_model:' /tmp/rga-interchange/rga_reinsurance_performance.ossie.yml
          grep -q 'vendor_name: SNOWFLAKE' /tmp/rga-interchange/rga_reinsurance_performance.ossie.yml
          grep -q 'snowflake_semantic_view' /tmp/rga-parity/parity_manifest.json
          grep -q 'cortex_agent_mcp' /tmp/rga-parity/parity_manifest.json
          grep -q 'power_bi' /tmp/rga-parity/parity_manifest.json
          grep -q 'excel' /tmp/rga-parity/parity_manifest.json
          grep -q 'semantic_manifest_sha256' /tmp/rga-release/release_manifest.json
          grep -q 'external_certification_required' /tmp/rga-release/release_manifest.json
          grep -q 'round_trip_import_supported' /tmp/rga-release/interchange/ossie_compatibility.json
          grep -q 'semantic_deploy_gate' /tmp/rga-airflow/rga_synthetic_pipeline.py
