name: cleanup-legacy-branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-legacy-branch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete legacy development branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete altimate-full-parity
