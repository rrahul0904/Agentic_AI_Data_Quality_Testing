name: semantic-platform-distribution

on:
  pull_request:
    branches:
      - feature/snowflake-pipeline-testing
    paths:
      - "scripts/rga_testbed/export_semantic_platform_core.py"
      - "scripts/rga_testbed/export_semantic_platform_distribution.py"
      - "tests/rga_testbed/test_semantic_platform_core_export.py"
      - "tests/rga_testbed/test_semantic_platform_distribution.py"
      - "config/examples/banking_semantic_contract.yml"
      - ".github/workflows/semantic-platform-distribution.yml"
  push:
    branches:
      - feature/rga-synthetic-domain-pack
    paths:
      - "scripts/rga_testbed/export_semantic_platform_core.py"
      - "scripts/rga_testbed/export_semantic_platform_distribution.py"
      - "tests/rga_testbed/test_semantic_platform_core_export.py"
      - "tests/rga_testbed/test_semantic_platform_distribution.py"
      - "config/examples/banking_semantic_contract.yml"
      - ".github/workflows/semantic-platform-distribution.yml"

permissions:
  contents: read

concurrency:
  group: semantic-platform-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run distribution tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/rga_testbed/test_semantic_platform_core_export.py \
            tests/rga_testbed/test_semantic_platform_distribution.py
      - name: Export installable distribution
        run: |
          python scripts/rga_testbed/export_semantic_platform_distribution.py \
            --contract config/examples/banking_semantic_contract.yml \
            --output /tmp/semantic-platform-dist >/tmp/semantic-platform-dist.json
          grep -q '"status": "PASS"' /tmp/semantic-platform-dist.json
          grep -q '"installable_python_distribution": true' /tmp/semantic-platform-dist.json
          test -f /tmp/semantic-platform-dist/pyproject.toml
          test -f /tmp/semantic-platform-dist/scripts/semantic_platform_core/cli.py
          test -f /tmp/semantic-platform-dist/scripts/semantic_platform_core/default_semantic_contract.yml
          test ! -f /tmp/semantic-platform-dist/scripts/semantic_platform_core/generate_data.py
          test ! -f /tmp/semantic-platform-dist/scripts/semantic_platform_core/generate_change_events.py
      - name: Build and install exported distribution
        run: |
          python -m pip wheel --no-deps /tmp/semantic-platform-dist -w /tmp/semantic-platform-wheel
          test "$(find /tmp/semantic-platform-wheel -name '*.whl' | wc -l)" -eq 1
          python -m pip install --no-deps --force-reinstall /tmp/semantic-platform-wheel/*.whl
          semantic-platform-core about >/tmp/core-about.json
          grep -q '"product": "governed_semantic_platform_core"' /tmp/core-about.json
          grep -q '"reference_workload_included": false' /tmp/core-about.json
      - name: Run installed CLI outside export directory
        working-directory: /tmp
        run: |
          semantic-platform-core validate-contract >/tmp/core-validate.json
          grep -q '"status": "PASS"' /tmp/core-validate.json
          grep -q '"name": "BANKING_ACCOUNT_PERFORMANCE"' /tmp/core-validate.json
          semantic-platform-core release \
            --database BANKING_ANALYTICS \
            --output /tmp/installed-core-release \
            --source-sha "$GITHUB_SHA" >/tmp/core-release.json
          grep -q '"status": "PASS"' /tmp/core-release.json
          grep -q 'BANKING_ANALYTICS.SEMANTIC.BANKING_ACCOUNT_PERFORMANCE' /tmp/installed-core-release/release_manifest.json
          test ! -d /tmp/installed-core-release/multi_fact
          test -f /tmp/installed-core-release/ai/mcp_spec.yml
          test -f /tmp/installed-core-release/microsoft/PARITY_CHECKLIST.md
      - name: Verify distribution neutrality
        run: |
          if grep -R -n -E 'scripts\.rga_testbed|RGA_SYNTHETIC_TESTBED|rga_semantic_contract\.yml' \
            /tmp/semantic-platform-dist/scripts/semantic_platform_core --include='*.py'; then
            echo "RGA implementation defaults leaked into installable distribution"
            exit 1
          fi
