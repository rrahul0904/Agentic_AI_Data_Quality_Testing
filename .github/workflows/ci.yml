name: integrated-platform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Latest commit wins. The previous matrix requested ~28 hosted runners per push
# and created a large stale queue during rapid release hardening.
concurrency:
  group: integrated-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-3-11:
    name: Python 3.11 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,testbed]'
      - run: python scripts/parse_dbt.py
      - run: pytest -q tests integration/e2e-tests
      - run: ruff check src tests integration/e2e-tests scripts

  release-3-12:
    name: Python 3.12 release certification
    needs: python-3-11
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python projects
        run: |
          python -m pip install -e '.[dev,testbed]'
          python -m pip install -e './shiftforge[dev]'
          python -m pip install -e './hospitality-snowflake-data-platform[dev]'

      - name: Install operator console
        run: npm ci
        working-directory: apps/web

      - name: Parse dbt artifacts
        run: python scripts/parse_dbt.py

      - name: Run canonical release verification
        run: make verify

      - name: Verify Node deterministic harness
        working-directory: local-data-harness
        run: |
          npm test
          npm run quality

      - name: Verify Airflow 3 contract explicitly
        env:
          ADE_AIRFLOW_VERSION: "3.3.0"
        run: |
          pytest -q tests/test_airflow_control_plane.py tests/integration/test_airflow_full_surface.py
          bash scripts/demo-airflow.sh

      - name: Run bounded Data Diff scale smoke
        run: |
          PYTHONPATH=src pytest -q tests/quality/test_data_diff_benchmark.py tests/quality/test_live_data_diff_100m.py
          PYTHONPATH=src python benchmarks/data_diff/run.py \
            --sizes 10000,100000 \
            --output artifacts/data-diff-benchmark-ci.json

      - name: Verify wheel outside repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/wheel
          python -m pip wheel . --no-deps -w artifacts/wheel
          python -m pip install --force-reinstall --no-deps artifacts/wheel/*.whl
          (
            cd /tmp
            python -c "import agentic_data_platform; print(agentic_data_platform.__file__)"
            agentic-data-platform --help
          )

      - name: Run operator-console smoke
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/src"
          export ADE_DEMO_MODE=true
          export ADE_DEMO_PROJECT="$PWD/hospitality-snowflake-data-platform"
          export ADE_QUALITY_DATABASE="$PWD/.ade/quality.db"
          export ADE_DATABASE_PATH="$PWD/.ade/control-plane.db"

          PYTHONPATH=src ADE_QUALITY_DATABASE="$ADE_QUALITY_DATABASE" python scripts/init_demo_evidence.py
          python -m uvicorn agentic_data_platform.api.app:app --host 127.0.0.1 --port 8001 > /tmp/ade-api.log 2>&1 &
          API_PID=$!
          (
            cd apps/web
            NEXT_PUBLIC_ADE_API_URL=http://127.0.0.1:8001 npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ade-web.log 2>&1
          ) &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID 2>/dev/null || true' EXIT

          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/api/v1/overview > /tmp/overview.json \
              && curl -fsS http://127.0.0.1:3000 > /tmp/console.html; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != "true" ]; then
            echo "API log:"
            cat /tmp/ade-api.log || true
            echo "Web log:"
            cat /tmp/ade-web.log || true
            exit 1
          fi

          python - <<'PY'
          import json
          data = json.load(open("/tmp/overview.json"))
          assert data["counts"]["oracle_tables"] == 144
          assert data["counts"]["postgres_tables"] == 157
          assert data["counts"]["airflow_dags"] >= 57
          assert data["counts"]["dbt_models"] == 70
          assert data["counts"]["tools"] >= 50
          PY

          curl -fsS http://127.0.0.1:8001/api/v1/airflow/assets >/dev/null
          curl -fsS http://127.0.0.1:8001/api/v1/providers >/dev/null
          curl -fsS http://127.0.0.1:8001/api/v1/skills/catalog >/dev/null
          curl -fsS http://127.0.0.1:8001/api/v1/training/status >/dev/null
          grep -q "Agentic" /tmp/console.html
          grep -q "Providers" /tmp/console.html
          grep -q "Settings / Doctor" /tmp/console.html

      - name: Generate exact-head release evidence
        run: PYTHONPATH=src python scripts/generate_release_evidence.py --ci-status PASS_CI

      - uses: actions/upload-artifact@v4
        with:
          name: release-readiness-${{ github.sha }}
          path: |
            artifacts/release-readiness.json
            artifacts/data-diff-benchmark-ci.json
            artifacts/wheel/*
          if-no-files-found: error
