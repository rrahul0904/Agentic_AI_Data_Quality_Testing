name: web-e2e

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "src/agentic_data_platform/api/**"
      - "src/agentic_data_platform/**"
      - "deploy/**"
      - "docker-compose.web.yml"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/web-e2e.yml"
  push:
    branches:
      - main
      - feature/ade-10x-competitive-certification
    paths:
      - "apps/web/**"
      - "src/agentic_data_platform/api/**"
      - "src/agentic_data_platform/**"
      - "deploy/**"
      - "docker-compose.web.yml"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/web-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website-e2e:
    name: Production web + API container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Typecheck and build Next.js operator console
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build and start production containers
        run: docker compose -f docker-compose.web.yml up -d --build

      - name: Wait for browser-facing ADE control plane
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8001/healthz > /tmp/api-health.json \
              && curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/api/healthz > /tmp/web-health.json \
              && curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/api/ade/healthz > /tmp/proxy-health.json \
              && curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:3000/ > /tmp/home.html; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker compose -f docker-compose.web.yml ps || true
            docker compose -f docker-compose.web.yml logs --no-color || true
            exit 1
          fi

          python - <<'PY'
          import json
          for path in ("/tmp/api-health.json", "/tmp/web-health.json", "/tmp/proxy-health.json"):
              payload = json.load(open(path))
              assert payload["status"] == "PASS", (path, payload)
          PY

      - name: Verify browser-facing ADE product surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 2 --max-time 30 \
            http://127.0.0.1:3000/api/ade/api/v1/overview > /tmp/overview.json
          curl -fsS --connect-timeout 2 --max-time 30 \
            http://127.0.0.1:3000/api/ade/api/v1/competitive/status > /tmp/competitive.json
          curl -fsS --connect-timeout 2 --max-time 30 \
            http://127.0.0.1:3000/api/ade/api/v1/domains > /tmp/domains.json

          curl -fsS --connect-timeout 2 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"args":{}}' \
            http://127.0.0.1:3000/api/ade/api/v1/dbt-next/agents-schema > /tmp/dbt-next-agents-schema.json

          curl -fsS --connect-timeout 2 --max-time 30 \
            -H 'Content-Type: application/json' \
            -d '{"args":{"source":"/tmp/orders.parquet","source_type":"parquet","limit":5}}' \
            http://127.0.0.1:3000/api/ade/api/v1/dbt-next/lake-plan > /tmp/dbt-next-lake-plan.json

          python - <<'PY'
          import json
          overview = json.load(open("/tmp/overview.json"))
          assert overview["counts"]["oracle_tables"] == 144
          assert overview["counts"]["postgres_tables"] == 157
          assert overview["counts"]["airflow_dags"] >= 57
          assert overview["counts"]["dbt_models"] == 70
          assert overview["counts"]["tools"] >= 50

          competitive = json.load(open("/tmp/competitive.json"))
          assert competitive["status"] == "PASS", competitive

          domains = json.load(open("/tmp/domains.json"))
          assert "dbt-next" in domains, domains
          assert "agents-schema" in domains["dbt-next"], domains["dbt-next"]
          assert "lake-plan" in domains["dbt-next"], domains["dbt-next"]

          schema = json.load(open("/tmp/dbt-next-agents-schema.json"))
          assert schema["status"] == "PASS", schema
          assert schema["schema_version"] == "ade-agents/1.0", schema

          lake = json.load(open("/tmp/dbt-next-lake-plan.json"))
          assert lake["status"] == "PLAN", lake
          assert lake["engine"] == "duckdb", lake
          assert "read_parquet" in lake["sql"], lake
          PY

          for endpoint in \
            /api/v1/platform/inventory \
            /api/v1/airflow/inventory \
            /api/v1/airflow/assets \
            /api/v1/dbt/summary \
            /api/v1/quality/summary \
            /api/v1/providers \
            /api/v1/skills/catalog \
            /api/v1/training/status \
            /api/v1/certification/coco \
            /api/v1/competitive/status \
            /api/v1/knowledge/status; do
            curl -fsS --connect-timeout 2 --max-time 30 \
              "http://127.0.0.1:3000/api/ade${endpoint}" >/dev/null
          done

          curl -fsS --connect-timeout 2 --max-time 30 \
            http://127.0.0.1:3000/certification > /tmp/certification.html
          grep -q "ADE OS" /tmp/home.html
          grep -q "Agentic" /tmp/home.html
          grep -q "dbt Next" /tmp/home.html
          grep -q "Certification" /tmp/certification.html

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.web.yml logs --no-color || true

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.web.yml down -v --remove-orphans
