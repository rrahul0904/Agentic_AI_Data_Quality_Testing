name: data-diff-benchmark

on:
  workflow_dispatch:
    inputs:
      run_full_local:
        description: Run the complete local 10K through 10M benchmark
        required: true
        type: boolean
        default: true
      run_external_100m:
        description: Run the configured external 100M+ certification
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-diff-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: PYTHONPATH=src pytest -q tests/quality/test_data_diff_benchmark.py tests/quality/test_live_data_diff_100m.py
      - run: PYTHONPATH=src python benchmarks/data_diff/run.py --sizes 10000,100000 --output artifacts/data-diff-benchmark-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: data-diff-smoke-${{ github.sha }}
          path: artifacts/data-diff-benchmark-ci.json

  local-full:
    if: inputs.run_full_local
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: PYTHONPATH=src python benchmarks/data_diff/run.py --output artifacts/data-diff-benchmark-full.json
      - uses: actions/upload-artifact@v4
        with:
          name: data-diff-full-${{ github.sha }}
          path: artifacts/data-diff-benchmark-full.json

  external-100m:
    if: inputs.run_external_100m
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      ADE_DATA_DIFF_SOURCE_PLATFORM: ${{ vars.ADE_DATA_DIFF_SOURCE_PLATFORM }}
      ADE_DATA_DIFF_TARGET_PLATFORM: ${{ vars.ADE_DATA_DIFF_TARGET_PLATFORM }}
      ADE_DATA_DIFF_SOURCE_TABLE: ${{ vars.ADE_DATA_DIFF_SOURCE_TABLE }}
      ADE_DATA_DIFF_TARGET_TABLE: ${{ vars.ADE_DATA_DIFF_TARGET_TABLE }}
      ADE_DATA_DIFF_KEYS: ${{ vars.ADE_DATA_DIFF_KEYS }}
      ADE_DATA_DIFF_COMPARE_COLUMNS: ${{ vars.ADE_DATA_DIFF_COMPARE_COLUMNS }}
      ADE_DATA_DIFF_EXPECT_STATUS: ${{ vars.ADE_DATA_DIFF_EXPECT_STATUS }}
      ADE_DATA_DIFF_EXPECT_CHANGED_KEYS: ${{ vars.ADE_DATA_DIFF_EXPECT_CHANGED_KEYS }}
      ADE_DATA_DIFF_EXPECT_MISSING_KEYS: ${{ vars.ADE_DATA_DIFF_EXPECT_MISSING_KEYS }}
      ADE_DATA_DIFF_EXPECT_EXTRA_KEYS: ${{ vars.ADE_DATA_DIFF_EXPECT_EXTRA_KEYS }}
      ADE_DATA_DIFF_TIMEOUT_SECONDS: ${{ vars.ADE_DATA_DIFF_TIMEOUT_SECONDS }}
      ADE_SNOWFLAKE_ACCOUNT: ${{ secrets.ADE_SNOWFLAKE_ACCOUNT }}
      ADE_SNOWFLAKE_USER: ${{ secrets.ADE_SNOWFLAKE_USER }}
      ADE_SNOWFLAKE_PASSWORD: ${{ secrets.ADE_SNOWFLAKE_PASSWORD }}
      ADE_SNOWFLAKE_DATABASE: ${{ vars.ADE_SNOWFLAKE_DATABASE }}
      ADE_SNOWFLAKE_SCHEMA: ${{ vars.ADE_SNOWFLAKE_SCHEMA }}
      ADE_SNOWFLAKE_WAREHOUSE: ${{ vars.ADE_SNOWFLAKE_WAREHOUSE }}
      ADE_POSTGRES_DSN: ${{ secrets.ADE_POSTGRES_DSN }}
      ADE_REDSHIFT_DSN: ${{ secrets.ADE_REDSHIFT_DSN }}
      ADE_BIGQUERY_PROJECT: ${{ vars.ADE_BIGQUERY_PROJECT }}
      ADE_DATABRICKS_HOST: ${{ vars.ADE_DATABRICKS_HOST }}
      ADE_DATABRICKS_TOKEN: ${{ secrets.ADE_DATABRICKS_TOKEN }}
      ADE_DATABRICKS_HTTP_PATH: ${{ vars.ADE_DATABRICKS_HTTP_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,warehouses]'
      - run: PYTHONPATH=src python scripts/live_data_diff_100m.py
