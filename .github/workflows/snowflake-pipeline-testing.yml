name: snowflake-pipeline-testing

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/agentic_data_platform/snowflake/**'
      - 'src/agentic_data_platform/tools/builtin.py'
      - 'src/agentic_data_platform/cli.py'
      - 'src/agentic_data_platform/api/app.py'
      - 'tests/test_snowflake_*.py'
      - 'scripts/live_snowflake_pipeline_testing.py'
      - 'docs/SNOWFLAKE_PIPELINE_TESTING.md'
      - '.github/workflows/snowflake-pipeline-testing.yml'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run read-only live Snowflake pipeline certification'
        required: false
        default: false
        type: boolean

concurrency:
  group: snowflake-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Targeted Snowflake pipeline tests
        run: make snowflake-pipeline-test
      - name: Static COPY smoke
        run: |
          ade snowflake-test copy-analyze --args '{"sql":"COPY INTO RAW.RESERVATION FROM @LANDING FILE_FORMAT=(TYPE=CSV) ON_ERROR=ABORT_STATEMENT"}'
      - name: Failure lab smoke
        run: ade snowflake-test failure-lab --args '{"scenario":"invalid_timestamp"}'

  live-certification:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live == true
    needs: local-certification
    runs-on: ubuntu-latest
    environment: snowflake-pipeline-test
    env:
      ADE_SNOWFLAKE_ACCOUNT: ${{ secrets.ADE_SNOWFLAKE_ACCOUNT }}
      ADE_SNOWFLAKE_USER: ${{ secrets.ADE_SNOWFLAKE_USER }}
      ADE_SNOWFLAKE_PASSWORD: ${{ secrets.ADE_SNOWFLAKE_PASSWORD }}
      ADE_SNOWFLAKE_DATABASE: ${{ secrets.ADE_SNOWFLAKE_DATABASE }}
      ADE_SNOWFLAKE_SCHEMA: ${{ secrets.ADE_SNOWFLAKE_SCHEMA }}
      ADE_SNOWFLAKE_WAREHOUSE: ${{ secrets.ADE_SNOWFLAKE_WAREHOUSE }}
      ADE_SNOWFLAKE_ROLE: ${{ secrets.ADE_SNOWFLAKE_ROLE }}
      ADE_LIVE_SNOWFLAKE_STAGE: ${{ secrets.ADE_LIVE_SNOWFLAKE_STAGE }}
      ADE_LIVE_SNOWFLAKE_FILE_FORMAT: ${{ secrets.ADE_LIVE_SNOWFLAKE_FILE_FORMAT }}
      ADE_LIVE_SNOWFLAKE_PIPE: ${{ secrets.ADE_LIVE_SNOWFLAKE_PIPE }}
      ADE_LIVE_SNOWFLAKE_STREAM: ${{ secrets.ADE_LIVE_SNOWFLAKE_STREAM }}
      ADE_LIVE_SNOWFLAKE_TARGET_TABLE: ${{ secrets.ADE_LIVE_SNOWFLAKE_TARGET_TABLE }}
      ADE_LIVE_SNOWFLAKE_KEY_COLUMNS: ${{ vars.ADE_LIVE_SNOWFLAKE_KEY_COLUMNS }}
      ADE_LIVE_SNOWFLAKE_NOT_NULL_COLUMNS: ${{ vars.ADE_LIVE_SNOWFLAKE_NOT_NULL_COLUMNS }}
      ADE_LIVE_SNOWFLAKE_FRESHNESS_COLUMN: ${{ vars.ADE_LIVE_SNOWFLAKE_FRESHNESS_COLUMN }}
      ADE_LIVE_SNOWFLAKE_MAX_LATENCY_MINUTES: ${{ vars.ADE_LIVE_SNOWFLAKE_MAX_LATENCY_MINUTES }}
      ADE_LIVE_SNOWFLAKE_MAX_REJECTED_ROWS: ${{ vars.ADE_LIVE_SNOWFLAKE_MAX_REJECTED_ROWS }}
      ADE_LIVE_SNOWFLAKE_HISTORY_HOURS: ${{ vars.ADE_LIVE_SNOWFLAKE_HISTORY_HOURS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install with Snowflake connector
        run: python -m pip install -e '.[dev,warehouses]'
      - name: Run read-only live certification
        run: make snowflake-pipeline-live-e2e
