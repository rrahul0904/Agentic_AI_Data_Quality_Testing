services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      PORT: "8001"
      ADE_DEMO_MODE: "true"
      ADE_DEMO_PROJECT: /app/hospitality-snowflake-data-platform
      ADE_DATABASE_PATH: /state/control-plane.db
      ADE_QUALITY_DATABASE: /state/quality.db
      ADE_INVESTIGATION_DATABASE: /state/investigations.db
    volumes:
      - ade-state:/state
      - ade-runtime:/app/.ade
      - ade-project-runtime:/app/hospitality-snowflake-data-platform/.ade
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      ADE_API_URL: http://api:8001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/api/healthz
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  ade-state:
  ade-runtime:
  ade-project-runtime:
