<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Data Harness</title><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}body{margin:0;background:#0b0d10;color:#e8eaed}.shell{max-width:1180px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #2b3038;padding-bottom:16px}.muted{color:#9aa4b2}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.panel{border:1px solid #2b3038;border-radius:8px;background:#11151a;padding:16px}textarea{box-sizing:border-box;width:100%;min-height:110px;background:#0b0d10;color:#fff;border:1px solid #343b45;border-radius:6px;padding:12px;font:inherit}button{margin-top:10px;padding:9px 14px;background:#e8eaed;color:#0b0d10;border:0;border-radius:5px;font:inherit;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;overflow:auto;min-height:120px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid #252b33;padding:7px 4px;vertical-align:top}.pill{border:1px solid #3a424d;border-radius:999px;padding:4px 8px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><div class="top"><div><h2 style="margin:0">Local Data Harness</h2><div class="muted">local-first agentic data engineering draft</div></div><span id="health" class="pill">checking…</span></div>
<div class="grid"><div class="panel"><b>Agent</b><p class="muted">Try: <code>analyze models/orders.sql</code>, <code>lineage models/orders.sql</code>, <code>dbt inspect</code>, or <code>run select * from orders</code>.</p><textarea id="prompt">analyze models/orders.sql</textarea><br><button id="run">Run</button><pre id="out">Ready.</pre></div><div class="panel"><b>Tools</b><table><tbody id="tools"></tbody></table></div></div>
<div class="panel" style="margin-top:16px"><b>Recent sessions</b><table><thead><tr><th>Status</th><th>Prompt</th><th>Answer</th></tr></thead><tbody id="sessions"></tbody></table></div></div>
<script>
const $=s=>document.querySelector(s); async function json(url,opt){const r=await fetch(url,opt);const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
async function refresh(){const h=await json('/health');$('#health').textContent=`${h.provider} · ${h.mode}`;const tools=await json('/api/tools');$('#tools').innerHTML=tools.map(t=>`<tr><td><b>${t.name}</b><br><span class="muted">${t.description}</span></td></tr>`).join('');const ss=await json('/api/sessions');$('#sessions').innerHTML=ss.map(s=>`<tr><td>${s.status}</td><td>${esc(s.prompt)}</td><td>${esc(s.answer||'')}</td></tr>`).join('')}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
$('#run').onclick=async()=>{const prompt=$('#prompt').value.trim();if(!prompt)return;$('#out').textContent='Running…';try{const r=await json('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt})});$('#out').textContent=r.answer;await refresh()}catch(e){$('#out').textContent='Error: '+e.message}};refresh().catch(e=>$('#health').textContent='offline');
</script></body></html>
